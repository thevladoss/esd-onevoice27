name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Джобе build хватает чтения репозитория: права на публикацию Pages выданы
# только джобе deploy, чтобы install-скрипты зависимостей не получали OIDC-токен.
permissions:
  contents: read

# Идущий деплой не отменяем: прерванный deploy-pages оставляет деплоймент
# в подвешенном состоянии, и следующий запуск падает с «deployment already
# in progress».
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages читает настройки Pages через GET /repos/{owner}/{repo}/pages;
      # публиковать эта джоба не может.
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Приёмка собранного билда стоит в воротах, а не в ручном чеклисте: регрессия base,
      # потерянный чанк vendor-map или чужой хост в index.html не уедут на Pages.
      - run: npm run check:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
